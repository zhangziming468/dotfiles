general {
    colors = true
    color_good = '#22ddcc'
    color_degraded = '#dd9933'
    color_bad = '#aa5566'
    interval = 5
  }

order += "wireless _first_"
order += "battery all"
order += "cpu_usage"
order += "memory"
order += "volume master"
order += "tztime local"

wireless _first_ {
    format_up = "W: %quality %essid %ip"
    format_down = "W: down"
}

battery all {
    format = "%status %percentage %remaining"
    format_down = "No battery"
    status_chr = "ing" # 充电中
    status_bat = "ed" # 使用电池
    status_full = "fu" # 充满
    low_threshold = 10
}

cpu_usage {
    format = "CPU: %usage"
}

memory {
    format = "Mem: %used"
}

volume master {
    format = "♪ %volume"
    format_muted = "🔇 %volume"
    device = "default"
}

tztime local {
    format = "%Y-%m-%d %H:%M"
}
