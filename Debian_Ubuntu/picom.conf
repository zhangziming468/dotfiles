# ==========================================
# 基础与后端设置 (适配 pijulius 分支)
# ==========================================
backend = "glx";
vsync = true;
corner-radius = 10;
blur: {
    method = "dual_kawase";
    strength = 7;
    background = true;
    background-frame = true;
    background-fixed = true;
}
blur-kern = "3x3box"

# ==========================================
# 阴影设置 (沿用你原有的数值)
# ==========================================
shadow = true;
shadow-radius = 7;
shadow-opacity = 0.6;
shadow-offset-x = -7;
shadow-offset-y = -5;

# ==========================================
# 窗口规则 (统一使用 rules 语法)
# 将你之前的 shadow-exclude 迁移至此
# ==========================================
rules = (
    {
        match = "class_g = 'firefox' && argb";
        shadow = false;
    },
    {
        match = "class_g = 'i3-frame'";
        shadow = false;
    },
    {
        match = "class_g = 'TelegramDesktop' && argb";
        shadow = false;
    },
    {
        match = "class_g = 'thunderbird' && argb";
        shadow = false;
    },
    # 建议加入通知和提示框的排除，避免动画干扰
    {
        match = "window_type = 'notification'";
        shadow = false;
    },
    {
        match = "window_type = 'tooltip'";
        shadow = false;
    }
);

# ==========================================
# 动画系统 (替代旧的 fading 配置)
# ==========================================
animations = true;
animation-stiffness = 500;
animation-window-mass = 1.0;

# --- 窗口打开 / 关闭动画 ---
animations = (
    {
        triggers = [ "open" , "show" ];
        preset = "slide-in";
        direction = "up";       # 从上方滑入
        duration = 0.5;         # 动画时长 (秒)
    },
    {
        triggers = [ "close" , "hide" ];
        preset = "slide-out";
        direction = "down";     # 向下方滑出
        duration = 0.5;
        opacity = 1;
    }
);
